<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Syed Omer Ali</title>
  <style>
    :root {
      --bg-color: #0a0a0a;
      --text-color: #fafafa;
      --muted-color: #a3a3a3;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #ffffff;
        --text-color: #0a0a0a;
        --muted-color: #525252;
      }
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    p {
      color: var(--muted-color);
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    button {
      background-color: var(--text-color);
      color: var(--bg-color);
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.8;
    }
    button:focus-visible {
      outline: 2px solid var(--muted-color);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You're Offline</h1>
    <p>Looks like your internet connection was interrupted. Reconnect to the internet and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
