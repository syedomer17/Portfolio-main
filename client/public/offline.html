<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Syed Omer Ali</title>
  <style>
    :root {
      --bg: rgb(15, 23, 42);
      --fg: rgb(248, 250, 252);
      --card-bg: rgb(30, 41, 59);
      --card-border: rgb(71, 85, 105);
      --muted: rgb(148, 163, 184);
      --accent: rgb(251, 146, 60);
      --accent-hover: rgb(253, 186, 116);
      --dot-offline: #ef4444;
      --dot-online: #22c55e;
      --terminal-bg: rgb(9, 15, 29);
      --error-color: #f87171;
      --success-color: #4ade80;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: rgb(255, 255, 255);
        --fg: rgb(15, 23, 42);
        --card-bg: rgb(248, 250, 252);
        --card-border: rgb(226, 232, 240);
        --muted: rgb(100, 116, 139);
        --accent: rgb(59, 130, 246);
        --accent-hover: rgb(37, 99, 235);
        --dot-offline: #ef4444;
        --dot-online: #22c55e;
        --terminal-bg: rgb(241, 245, 249);
        --error-color: #dc2626;
        --success-color: #16a34a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-text-size-adjust: 100%;
    }

    header {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      user-select: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .dot-offline {
      background-color: var(--dot-offline);
      box-shadow: 0 0 6px var(--dot-offline);
    }

    .dot-online {
      background-color: var(--dot-online);
      box-shadow: 0 0 6px var(--dot-online);
    }

    .dot-pulse {
      background-color: var(--dot-online);
      box-shadow: 0 0 10px var(--dot-online);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot-pulse { animation: none; }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }

    .description {
      color: var(--muted);
      font-size: 0.925rem;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }

    /* Terminal */
    .terminal {
      background-color: var(--terminal-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.375rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.775rem;
      margin-bottom: 1.5rem;
      overflow: hidden;
      text-align: left;
    }

    .terminal-bar {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 0.4rem 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .td { width: 5px; height: 5px; border-radius: 50%; }
    .td-r { background: #ef4444; }
    .td-y { background: #f59e0b; }
    .td-g { background: #10b981; }

    .terminal-label {
      color: var(--muted);
      font-size: 0.7rem;
      margin-left: auto;
      font-weight: 500;
    }

    .terminal-body {
      padding: 0.75rem 0.875rem;
      max-height: 130px;
      overflow-y: auto;
      line-height: 1.45;
    }

    .tl { margin-bottom: 0.2rem; white-space: pre-wrap; word-break: break-all; }
    .tl:last-child { margin-bottom: 0; }
    .tp { color: var(--accent); font-weight: bold; user-select: none; }
    .tl-err { color: var(--error-color); }
    .tl-ok { color: var(--success-color); }

    /* Feedback banner */
    .fb {
      font-size: 0.825rem;
      padding: 0.6rem 0.875rem;
      border-radius: 0.25rem;
      margin-bottom: 1.25rem;
      display: none;
      font-weight: 500;
      text-align: left;
      line-height: 1.35;
    }
    .fb-err {
      display: block;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.18);
      color: var(--error-color);
    }
    .fb-ok {
      display: block;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.18);
      color: var(--success-color);
    }
    .fb-info {
      display: block;
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--muted);
    }

    /* Button */
    .retry-btn {
      background-color: var(--accent);
      color: rgb(15, 23, 42);
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: 0.25rem;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }

    .retry-btn:hover:not(:disabled) { background-color: var(--accent-hover); }
    .retry-btn:active:not(:disabled) { transform: scale(0.98); }
    .retry-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .retry-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    footer {
      width: 100%;
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.7rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .retry-btn { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Syed Omer</div>
    <div class="status-badge" aria-live="polite">
      <span id="dot" class="dot dot-offline"></span>
      <span id="status">Offline</span>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>Connection Lost</h1>
      <p class="description">You're currently offline. Reconnect to the internet and try again.</p>

      <div class="terminal" aria-hidden="true">
        <div class="terminal-bar">
          <span class="td td-r"></span>
          <span class="td td-y"></span>
          <span class="td td-g"></span>
          <span class="terminal-label">zsh</span>
        </div>
        <div class="terminal-body" id="term">
          <div class="tl"><span class="tp">$ </span>ping -c 1 syedomer.me</div>
          <div class="tl tl-err">ping: sendto: Network is unreachable</div>
        </div>
      </div>

      <div id="fb" class="fb" role="alert"></div>

      <button type="button" class="retry-btn" id="btn" aria-label="Try Again">Try Again</button>
    </div>
  </main>

  <footer id="ft"></footer>

  <script>
    // DOM refs
    var dot = document.getElementById('dot');
    var status = document.getElementById('status');
    var btn = document.getElementById('btn');
    var fb = document.getElementById('fb');
    var term = document.getElementById('term');
    var ft = document.getElementById('ft');

    // Footer year (no document.write)
    ft.textContent = '\u00A9 ' + new Date().getFullYear() + ' Syed Omer Ali. All rights reserved.';

    var checking = false;

    function log(cmd, out, err) {
      var cls = err ? ' tl-err' : (out.indexOf('64 bytes') > -1 || out.indexOf('restored') > -1 ? ' tl-ok' : '');
      var h = '<div class="tl"><span class="tp">$ </span>' + cmd + '</div>'
            + '<div class="tl' + cls + '">' + out + '</div>';
      term.insertAdjacentHTML('beforeend', h);
      term.scrollTop = term.scrollHeight;
    }

    function setOffline(msg) {
      checking = false;
      btn.disabled = false;
      btn.textContent = 'Try Again';
      fb.className = 'fb fb-err';
      fb.textContent = msg || 'Connection still unavailable. Check your internet and try again.';
      dot.className = 'dot dot-offline';
      status.textContent = 'Offline';
    }

    function setOnline() {
      checking = false;
      btn.disabled = true;
      btn.textContent = 'Reloading\u2026';
      fb.className = 'fb fb-ok';
      fb.textContent = 'Internet connection detected. Reloading portfolio\u2026';
      dot.className = 'dot dot-online';
      status.textContent = 'Online';
      log('ping -c 1 syedomer.me', '64 bytes from syedomer.me: icmp_seq=1 ttl=56 time=14.3 ms', false);
      setTimeout(function () { location.reload(); }, 800);
    }

    function check() {
      if (checking) return;
      checking = true;
      btn.disabled = true;
      btn.textContent = 'Checking connection\u2026';
      fb.className = 'fb fb-info';
      fb.textContent = 'Testing network reachability\u2026';

      // Quick gate: navigator.onLine
      if (!navigator.onLine) {
        setTimeout(function () {
          log('ping -c 1 syedomer.me', 'ping: sendto: Network is unreachable', true);
          setOffline();
        }, 600);
        return;
      }

      // Real connectivity check: HEAD request to a lightweight same-origin asset.
      // This bypasses the Service Worker because mode !== 'navigate'.
      var ctrl = new AbortController();
      var tid = setTimeout(function () { ctrl.abort(); }, 4000);

      fetch('/favicon-16x16.png?_sw_check=' + Date.now(), {
        method: 'HEAD',
        cache: 'no-store',
        signal: ctrl.signal
      }).then(function (r) {
        clearTimeout(tid);
        if (r.ok) {
          setOnline();
        } else {
          log('curl -I syedomer.me', 'HTTP ' + r.status, true);
          setOffline('Server returned an error. Please try again shortly.');
        }
      }).catch(function (e) {
        clearTimeout(tid);
        var msg = e.name === 'AbortError' ? 'ping: request timeout' : 'ping: sendto: Host is unreachable';
        log('ping -c 1 syedomer.me', msg, true);
        setOffline();
      });
    }

    // Attach via addEventListener (no inline onclick — safe with any CSP)
    btn.addEventListener('click', check);

    // Passive network events
    window.addEventListener('online', function () {
      dot.className = 'dot dot-pulse';
      status.textContent = 'Back Online';
      fb.className = 'fb fb-ok';
      fb.textContent = 'Connection restored. Tap below to continue.';
      btn.textContent = 'Continue';
      btn.disabled = false;
      log('ip link', 'state UP (connection restored)', false);
    });

    window.addEventListener('offline', function () {
      dot.className = 'dot dot-offline';
      status.textContent = 'Offline';
      fb.className = 'fb fb-err';
      fb.textContent = 'Connection lost.';
      btn.textContent = 'Try Again';
      log('ip link', 'state DOWN (connection lost)', true);
    });
  </script>
</body>
</html>
